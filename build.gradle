buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

def droidGateVersion = findProperty('publishVersion') ?: 'v1.0.0'

allprojects {
    repositories {
        google()
        maven { url "https://jitpack.io" }
        mavenCentral()
    }
    group = 'com.github.nightmare-space.DroidGate'
    version = droidGateVersion
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
