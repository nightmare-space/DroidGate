name: droidgate_flutter
description: Flutter client and embedded Android bootstrap plugin for DroidGate.
version: 1.0.0
homepage: https://github.com/nightmare-space/droidgate_flutter
publish_to: "none"

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.1
  signale: ^0.0.12
  global_repository:
    git: https://github.com/nightmare-space/global_repository
  dio: ^5.9.0
  retrofit: ^4.9.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.7

  analyzer: ^8.2.0
  retrofit_generator: 10.2.0
  build_runner: ^2.10.0
  json_serializable: ^6.10.0
  dart_mappable_builder: ^4.2.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nightmare.droidgate_flutter
        pluginClass: DroidGateFlutterPlugin
